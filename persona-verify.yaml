# Persona 验证 - 淘宝店铺诊断工具配置

identity: |
  开了3个月淘宝店，卖古装演出服，月销5单。
  不懂运营推广，标题是复制同行的，没做过竞品分析。
  店里有15个商品，多数0销量，想破零。
  不知道直通车、引力魔方、万相台这些是什么。

target: index.html

browser: edge

operations:
  - tab: 竞品分析
    action: 在输入框中粘贴已复制的竞品JSON数据，点击「分析数据」按钮
  - tab: 标题诊断
    action: 在输入框中输入"古装演出服女成人舞台定制"，点击「诊断」按钮
  - tab: 推广分析
    action: 勾选「运费险」和「淘金币」复选框，点击「生成推荐」按钮
