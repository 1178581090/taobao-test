# Persona 验证 - 淘宝店铺诊断工具配置

identity: |
  开了3个月淘宝店，卖古装演出服，月销5单。
  不懂运营推广，标题是复制同行的，没做过竞品分析。
  店里有15个商品，多数0销量，想破零。
  不知道直通车、引力魔方、万相台这些是什么。

target: index.html

browser: edge

# 跳过指定的检查类型（可选）
skip_checks: []

# 只报告包含指定标签的发现，空数组 = 全部（可选）
include_tags: []

operations:
  - tab: 竞品分析
    action: 在我的商品链接输入框中粘贴https://item.taobao.com/item.htm?id=984528704511，点击「分析竞品」按钮

  - tab: 推广分析
    action: 勾选「运费险」和「淘金币」为已开通 → 点击「刷新」按钮 → 检查结果是否显示"未开通渠道"和"已开通渠道"两个分组、每个渠道卡片的「在网页版打开」/「截图辅助定位」按钮是否正常、页面不再出现 hero 卡片和分组推荐列表

  - tab: 活动筛选
    action: 点击「🔍 一键获取店铺数据」按钮 → 等待扫描完成 → 检查店铺状态卡片是否正确显示（层级/体验分/保证金等）→ 检查"可参加"和"差一步"分组是否正确渲染 → 检查付费渠道的推荐理由（蓝色框）和预算警示（红色文字）→ 检查摘要栏是否显示付费项目数量及预算叠加提示

  - tab: 活动筛选
    action: 左侧筛选开关切换 → 取消勾选"可参加" → 检查对应卡片是否隐藏 → 重新勾选恢复 → 点击"暂不可参加"组标题展开折叠内容

  - tab: 活动筛选
    optional: true
    action: 点击「重新扫描店铺数据」按钮 → 检查拖拽导入区是否显示 → 拖入 scan-qianniu.json 文件 → 检查数据是否正确导入并渲染结果
